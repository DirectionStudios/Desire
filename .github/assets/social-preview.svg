<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Desire — a private, offline-first AI operating layer">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1d1a34"/>
      <stop offset="45%" stop-color="#141322"/>
      <stop offset="100%" stop-color="#0c0c11"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#988aba" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#6f5f96" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#988aba" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d3caf3"/>
      <stop offset="48%" stop-color="#988aba"/>
      <stop offset="100%" stop-color="#7a6ca6"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="star" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="640" cy="300" rx="560" ry="300" fill="url(#glow)"/>

  <!-- ===== constellation field (denser than banner, uses full height) ===== -->
  <g stroke="#988aba" stroke-width="0.9" stroke-opacity="0.28">
    <polyline points="118,110 214,176 150,300 268,352 210,470" fill="none"/>
    <polyline points="214,176 330,138 268,352" fill="none"/>
    <polyline points="1162,120 1060,182 1128,300 1006,360 1070,486" fill="none"/>
    <polyline points="1060,182 946,142 1006,360" fill="none"/>
    <polyline points="150,300 268,352 300,470" fill="none"/>
  </g>
  <g fill="#e8e3f7">
    <circle cx="118" cy="110" r="2.4" filter="url(#star)"/>
    <circle cx="214" cy="176" r="3.2" filter="url(#star)"><animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="138" r="1.9" filter="url(#star)"/>
    <circle cx="150" cy="300" r="2.7" filter="url(#star)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="268" cy="352" r="3.5" fill="#C9A84C" filter="url(#star)"/>
    <circle cx="210" cy="470" r="2.0" filter="url(#star)"/>
    <circle cx="1162" cy="120" r="2.3" filter="url(#star)"/>
    <circle cx="1060" cy="182" r="3.1" filter="url(#star)"><animate attributeName="opacity" values="1;0.4;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="946" cy="142" r="2.0" filter="url(#star)"/>
    <circle cx="1128" cy="300" r="2.6" filter="url(#star)"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1006" cy="360" r="3.4" fill="#247894" filter="url(#star)"/>
    <circle cx="1070" cy="486" r="2.0" filter="url(#star)"/>
    <circle cx="300" cy="470" r="1.8" filter="url(#star)"/>
    <!-- dust -->
    <circle cx="80" cy="520" r="1.3" fill-opacity="0.6"/>
    <circle cx="470" cy="90" r="1.3" fill-opacity="0.6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="86" r="1.4" fill-opacity="0.6"/>
    <circle cx="560" cy="560" r="1.3" fill-opacity="0.6"/>
    <circle cx="740" cy="566" r="1.4" fill-opacity="0.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1200" cy="540" r="1.3" fill-opacity="0.6"/>
    <circle cx="60" cy="300" r="1.2" fill-opacity="0.5"/>
    <circle cx="1224" cy="300" r="1.2" fill-opacity="0.5"/>
  </g>

  <!-- ===== deco frame ===== -->
  <g stroke="#C9A84C" stroke-opacity="0.45" fill="none" stroke-width="1.3">
    <rect x="30" y="30" width="1220" height="580"/>
    <rect x="39" y="39" width="1202" height="562" stroke-opacity="0.22"/>
    <path d="M30 82 L30 30 L82 30" stroke-opacity="0.8" stroke-width="2.2"/>
    <path d="M1250 82 L1250 30 L1198 30" stroke-opacity="0.8" stroke-width="2.2"/>
    <path d="M30 558 L30 610 L82 610" stroke-opacity="0.8" stroke-width="2.2"/>
    <path d="M1250 558 L1250 610 L1198 610" stroke-opacity="0.8" stroke-width="2.2"/>
  </g>

  <!-- ===== wordmark cluster ===== -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="640" y="292" text-anchor="middle" font-size="132" font-weight="700" letter-spacing="26" fill="url(#ink)" filter="url(#soft)" opacity="0.5">DESIRE</text>
    <text x="640" y="292" text-anchor="middle" font-size="132" font-weight="700" letter-spacing="26" fill="url(#ink)">DESIRE</text>

    <line x1="330" y1="336" x2="950" y2="336" stroke="url(#goldline)" stroke-width="1.5"/>
    <path d="M640 327 L651 336 L640 345 L629 336 Z" fill="#C9A84C"/>
    <circle cx="596" cy="336" r="2.2" fill="#C9A84C" fill-opacity="0.8"/>
    <circle cx="684" cy="336" r="2.2" fill="#C9A84C" fill-opacity="0.8"/>

    <text x="640" y="392" text-anchor="middle" font-size="26" font-weight="500" letter-spacing="4" fill="#c3bcda">A private, offline-first AI operating layer for your computer</text>
    <text x="640" y="430" text-anchor="middle" font-size="17" letter-spacing="7" fill="#8a84a0">SEES YOUR SCREEN&#160;&#160;·&#160;&#160;RUNS YOUR MACHINE&#160;&#160;·&#160;&#160;REMEMBERS EVERYTHING</text>

    <!-- feature pills -->
    <g font-size="15" letter-spacing="2" font-weight="600">
      <g transform="translate(430,470)">
        <rect x="0" y="0" width="128" height="38" rx="19" fill="#988aba" fill-opacity="0.10" stroke="#988aba" stroke-opacity="0.5"/>
        <text x="64" y="25" text-anchor="middle" fill="#c9bff0">OFFLINE</text>
      </g>
      <g transform="translate(576,470)">
        <rect x="0" y="0" width="128" height="38" rx="19" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-opacity="0.5"/>
        <text x="64" y="25" text-anchor="middle" fill="#dcc677">PRIVATE</text>
      </g>
      <g transform="translate(722,470)">
        <rect x="0" y="0" width="128" height="38" rx="19" fill="#247894" fill-opacity="0.10" stroke="#247894" stroke-opacity="0.6"/>
        <text x="64" y="25" text-anchor="middle" fill="#5fb6cf">YOURS</text>
      </g>
    </g>

    <text x="640" y="566" text-anchor="middle" font-size="13.5" letter-spacing="3" fill="#615c73" font-family="'Courier New', monospace">github.com/DirectionStudios/Desire</text>
  </g>
</svg>
