<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Desire — offline-first AI command system">
  <defs>
    <!-- Deep vignette background -->
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b1830"/>
      <stop offset="45%" stop-color="#141322"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </radialGradient>
    <!-- Purple aurora glow behind the wordmark -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#988aba" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6f5f96" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#988aba" stop-opacity="0"/>
    </radialGradient>
    <!-- Wordmark gradient: violet -> lilac -> gold kiss -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9bff0"/>
      <stop offset="48%" stop-color="#988aba"/>
      <stop offset="100%" stop-color="#7a6ca6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A84C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="star" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="420" fill="url(#bg)"/>
  <ellipse cx="640" cy="196" rx="520" ry="230" fill="url(#glow)"/>

  <!-- ============ CONSTELLATION FIELD ============ -->
  <g stroke="#988aba" stroke-width="0.9" stroke-opacity="0.30">
    <polyline points="120,86 208,150 150,238 262,286" fill="none"/>
    <polyline points="208,150 318,120 262,286" fill="none"/>
    <polyline points="1160,96 1066,150 1120,250 1012,300" fill="none"/>
    <polyline points="1066,150 968,118 1012,300" fill="none"/>
    <polyline points="150,238 262,286 340,360" fill="none"/>
    <polyline points="1120,250 1012,300 930,362" fill="none"/>
  </g>

  <!-- star dots -->
  <g fill="#e8e3f7">
    <circle cx="120" cy="86" r="2.3" filter="url(#star)"/>
    <circle cx="208" cy="150" r="3.1" filter="url(#star)"><animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="120" r="1.8" filter="url(#star)"/>
    <circle cx="150" cy="238" r="2.6" filter="url(#star)"><animate attributeName="opacity" values="0.6;1;0.6" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="262" cy="286" r="3.4" fill="#C9A84C" filter="url(#star)"/>
    <circle cx="340" cy="360" r="1.7" filter="url(#star)"/>
    <circle cx="1160" cy="96" r="2.2" filter="url(#star)"/>
    <circle cx="1066" cy="150" r="3.0" filter="url(#star)"><animate attributeName="opacity" values="1;0.4;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="968" cy="118" r="1.9" filter="url(#star)"/>
    <circle cx="1120" cy="250" r="2.5" filter="url(#star)"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1012" cy="300" r="3.3" fill="#247894" filter="url(#star)"/>
    <circle cx="930" cy="362" r="1.7" filter="url(#star)"/>
    <!-- scattered dust -->
    <circle cx="70" cy="330" r="1.3" fill-opacity="0.7"/>
    <circle cx="420" cy="70" r="1.2" fill-opacity="0.6"/>
    <circle cx="500" cy="360" r="1.4" fill-opacity="0.65"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="360" r="1.3" fill-opacity="0.6"/>
    <circle cx="860" cy="72" r="1.4" fill-opacity="0.7"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="340" r="1.3" fill-opacity="0.6"/>
    <circle cx="40" cy="180" r="1.2" fill-opacity="0.5"/>
    <circle cx="1244" cy="196" r="1.2" fill-opacity="0.5"/>
  </g>

  <!-- ============ ART-DECO FRAME ============ -->
  <g stroke="#C9A84C" stroke-opacity="0.45" fill="none" stroke-width="1.2">
    <rect x="26" y="26" width="1228" height="368"/>
    <rect x="34" y="34" width="1212" height="352" stroke-opacity="0.22"/>
    <!-- corner deco notches -->
    <path d="M26 70 L26 26 L70 26" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M1254 70 L1254 26 L1210 26" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M26 350 L26 394 L70 394" stroke-opacity="0.75" stroke-width="2"/>
    <path d="M1254 350 L1254 394 L1210 394" stroke-opacity="0.75" stroke-width="2"/>
  </g>

  <!-- ============ WORDMARK ============ -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="640" y="214" text-anchor="middle" font-size="112" font-weight="700" letter-spacing="24"
          fill="url(#ink)" filter="url(#soft)" opacity="0.5">DESIRE</text>
    <text x="640" y="214" text-anchor="middle" font-size="112" font-weight="700" letter-spacing="24"
          fill="url(#ink)">DESIRE</text>

    <!-- deco divider with center lozenge -->
    <line x1="360" y1="250" x2="920" y2="250" stroke="url(#gold)" stroke-width="1.4"/>
    <path d="M640 242 L650 250 L640 258 L630 250 Z" fill="#C9A84C"/>
    <circle cx="600" cy="250" r="2" fill="#C9A84C" fill-opacity="0.8"/>
    <circle cx="680" cy="250" r="2" fill="#C9A84C" fill-opacity="0.8"/>

    <text x="640" y="290" text-anchor="middle" font-size="19" font-weight="500" letter-spacing="8"
          fill="#9a93b4">OFFLINE-FIRST&#160;&#160;·&#160;&#160;LOCAL-BY-DEFAULT&#160;&#160;·&#160;&#160;YOURS</text>
    <text x="640" y="330" text-anchor="middle" font-size="14.5" letter-spacing="3.5" fill="#6f6a82"
          font-family="'Courier New', monospace">A secure AI command system — assistant · automation · workspace · sync</text>
  </g>
</svg>
